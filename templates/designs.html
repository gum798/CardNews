<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Pretendard';
    src: url('./fonts/PretendardVariable.woff2') format('woff2-variations');
    font-weight: 45 920;
    font-display: block;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; font-family: 'Pretendard', sans-serif; }
  .card { width: 1080px; height: 1350px; position: relative; display: flex; flex-direction: column; }
  .keep { word-break: keep-all; }

  /* ============ 공통 조각 ============ */
  .row { display: flex; align-items: center; justify-content: space-between; }
  .mark { border-radius: 12px; }
  .dots { display: flex; gap: 12px; }
  .dots span { width: 16px; height: 16px; border-radius: 50%; }

  /* ============ V1 에디토리얼 라이트 ============ */
  .v1 { background: #FFFFFF; color: #111318; padding: 72px; }
  .v1 .top { padding-bottom: 36px; border-bottom: 6px solid #111318; }
  .v1 .brand { display: flex; align-items: center; gap: 18px; }
  .v1 .mark { width: 44px; height: 44px; background: #2456E5; }
  .v1 .name { font-size: 40px; font-weight: 750; letter-spacing: -.01em; }
  .v1 .date { font-size: 30px; font-weight: 500; color: #6B7280; }
  .v1 .body { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .v1 .cat { align-self: flex-start; background: #2456E5; color: #fff; font-size: 34px; font-weight: 700; padding: 12px 32px; border-radius: 999px; margin-bottom: 48px; }
  .v1 .head { font-size: 84px; font-weight: 820; line-height: 1.24; letter-spacing: -.02em; }
  .v1 .sub { margin-top: 44px; font-size: 40px; font-weight: 500; line-height: 1.5; color: #6B7280; }
  .v1 .bot { padding-top: 32px; border-top: 2px solid #E5E7EB; }
  .v1 .src { font-size: 28px; color: #6B7280; }
  .v1 .dots span { background: #E5E7EB; }
  .v1 .dots span.on { background: #2456E5; }

  /* ============ V2 다크 모드 ============ */
  .v2 { background: #0E1116; color: #F5F6F8; padding: 72px; }
  .v2 .top { padding-bottom: 36px; border-bottom: 6px solid #F5F6F8; }
  .v2 .brand { display: flex; align-items: center; gap: 18px; }
  .v2 .mark { width: 44px; height: 44px; background: #4C8DFF; }
  .v2 .name { font-size: 40px; font-weight: 750; letter-spacing: -.01em; }
  .v2 .date { font-size: 30px; font-weight: 500; color: #9AA3AD; }
  .v2 .body { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .v2 .cat { align-self: flex-start; background: #4C8DFF; color: #0E1116; font-size: 34px; font-weight: 750; padding: 12px 32px; border-radius: 999px; margin-bottom: 48px; }
  .v2 .head { font-size: 84px; font-weight: 820; line-height: 1.24; letter-spacing: -.02em; }
  .v2 .sub { margin-top: 44px; font-size: 40px; font-weight: 500; line-height: 1.5; color: #9AA3AD; }
  .v2 .bot { padding-top: 32px; border-top: 2px solid #2A323B; }
  .v2 .src { font-size: 28px; color: #9AA3AD; }
  .v2 .dots span { background: #2A323B; }
  .v2 .dots span.on { background: #4C8DFF; }

  /* ============ V3 브레이킹 레드 ============ */
  .v3 { background: #FFFFFF; color: #14161A; padding: 72px; }
  .v3 .top { padding-bottom: 30px; border-bottom: 3px solid #E5322D; }
  .v3 .brand { display: flex; align-items: center; gap: 16px; }
  .v3 .mark { width: 40px; height: 40px; border-radius: 8px; background: #E5322D; }
  .v3 .name { font-size: 38px; font-weight: 800; }
  .v3 .date { font-size: 28px; font-weight: 600; color: #9AA0A6; }
  .v3 .body { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .v3 .cat { align-self: flex-start; display: flex; align-items: center; gap: 14px; background: #E5322D; color: #fff; font-size: 32px; font-weight: 800; padding: 12px 28px; border-radius: 6px; margin-bottom: 44px; letter-spacing: .04em; }
  .v3 .cat i { width: 16px; height: 16px; border-radius: 50%; background: #fff; display: inline-block; }
  .v3 .head { font-size: 86px; font-weight: 850; line-height: 1.2; letter-spacing: -.025em; }
  .v3 .sub { margin-top: 40px; font-size: 40px; font-weight: 600; line-height: 1.45; color: #4B5563; }
  .v3 .bot { padding-top: 30px; }
  .v3 .src { font-size: 28px; font-weight: 600; color: #E5322D; }
  .v3 .dots span { background: #F0D2D1; }
  .v3 .dots span.on { background: #E5322D; }

  /* ============ V4 컬러블록 상단 ============ */
  .v4 { background: #FFFFFF; color: #14161A; }
  .v4 .block { height: 560px; background: #2456E5; color: #fff; padding: 72px; display: flex; flex-direction: column; justify-content: space-between; border-radius: 0 0 40px 40px; }
  .v4 .brand { display: flex; align-items: center; gap: 18px; }
  .v4 .mark { width: 44px; height: 44px; background: #fff; }
  .v4 .name { font-size: 40px; font-weight: 750; }
  .v4 .cat { align-self: flex-start; border: 3px solid rgba(255,255,255,.6); color: #fff; font-size: 32px; font-weight: 700; padding: 10px 28px; border-radius: 999px; }
  .v4 .date { font-size: 30px; font-weight: 500; opacity: .85; margin-top: 20px; }
  .v4 .body { flex: 1; padding: 60px 72px; display: flex; flex-direction: column; justify-content: center; }
  .v4 .head { font-size: 78px; font-weight: 820; line-height: 1.24; letter-spacing: -.02em; }
  .v4 .sub { margin-top: 40px; font-size: 40px; font-weight: 500; line-height: 1.5; color: #6B7280; }
  .v4 .src { padding: 0 72px 60px; font-size: 28px; color: #9AA0A6; }

  /* ============ V5 좌측 액센트 바 ============ */
  .v5 { background: #FBFBFC; color: #14161A; padding: 90px 90px 90px 120px; }
  .v5::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 20px; background: #2456E5; }
  .v5 .brand { display: flex; align-items: center; gap: 16px; }
  .v5 .mark { width: 38px; height: 38px; background: #2456E5; }
  .v5 .name { font-size: 36px; font-weight: 750; }
  .v5 .body { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .v5 .cat { font-size: 32px; font-weight: 800; color: #2456E5; letter-spacing: .12em; margin-bottom: 30px; }
  .v5 .head { font-size: 82px; font-weight: 820; line-height: 1.22; letter-spacing: -.02em; }
  .v5 .sub { margin-top: 40px; font-size: 40px; font-weight: 500; line-height: 1.5; color: #6B7280; }
  .v5 .src { font-size: 28px; color: #9AA0A6; }

  /* ============ V6 하이라이트 마커 ============ */
  .v6 { background: #FFFFFF; color: #14161A; padding: 72px; }
  .v6 .top { padding-bottom: 40px; }
  .v6 .brand { display: flex; align-items: center; gap: 16px; }
  .v6 .mark { width: 40px; height: 40px; background: #111318; }
  .v6 .name { font-size: 38px; font-weight: 800; }
  .v6 .date { font-size: 28px; font-weight: 500; color: #9AA0A6; }
  .v6 .body { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .v6 .cat { align-self: flex-start; font-size: 32px; font-weight: 800; color: #14161A; margin-bottom: 40px; border-bottom: 4px solid #111318; padding-bottom: 4px; }
  .v6 .head { font-size: 84px; font-weight: 850; line-height: 1.35; letter-spacing: -.02em; }
  .v6 .head .hl { background: #FEE440; padding: 2px 10px; border-radius: 4px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .v6 .sub { margin-top: 44px; font-size: 40px; font-weight: 500; line-height: 1.5; color: #6B7280; }
  .v6 .src { font-size: 28px; color: #9AA0A6; }

  /* ============ V7 그라디언트 ============ */
  .v7 { background: linear-gradient(150deg, #1E3A8A 0%, #2456E5 55%, #6D28D9 100%); color: #fff; padding: 72px; }
  .v7 .top { padding-bottom: 36px; }
  .v7 .brand { display: flex; align-items: center; gap: 18px; }
  .v7 .mark { width: 44px; height: 44px; background: rgba(255,255,255,.9); }
  .v7 .name { font-size: 40px; font-weight: 750; }
  .v7 .date { font-size: 30px; font-weight: 500; opacity: .8; }
  .v7 .body { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .v7 .cat { align-self: flex-start; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.3); color: #fff; font-size: 32px; font-weight: 700; padding: 12px 32px; border-radius: 999px; margin-bottom: 48px; }
  .v7 .head { font-size: 86px; font-weight: 820; line-height: 1.22; letter-spacing: -.02em; }
  .v7 .sub { margin-top: 44px; font-size: 40px; font-weight: 500; line-height: 1.5; opacity: .85; }
  .v7 .src { font-size: 28px; opacity: .8; }
  .v7 .dots span { background: rgba(255,255,255,.35); }
  .v7 .dots span.on { background: #fff; }

  /* ============ V8 빅 넘버 (데이터형) ============ */
  .v8 { background: #F5F8FF; color: #14161A; padding: 72px; }
  .v8 .top { padding-bottom: 30px; }
  .v8 .brand { display: flex; align-items: center; gap: 16px; }
  .v8 .mark { width: 40px; height: 40px; background: #2456E5; }
  .v8 .name { font-size: 38px; font-weight: 750; }
  .v8 .date { font-size: 28px; font-weight: 500; color: #6B7280; }
  .v8 .body { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .v8 .cat { font-size: 30px; font-weight: 800; color: #2456E5; letter-spacing: .1em; }
  .v8 .head { margin-top: 20px; font-size: 50px; font-weight: 800; line-height: 1.3; letter-spacing: -.02em; }
  .v8 .big { margin-top: 48px; font-size: 260px; font-weight: 850; color: #2456E5; letter-spacing: -.03em; line-height: .9; }
  .v8 .lab { margin-top: 20px; font-size: 36px; font-weight: 600; color: #6B7280; }
  .v8 .src { font-size: 28px; color: #9AA0A6; }

  /* ============ V9 네이비 프리미엄 ============ */
  .v9 { background: #0B1F3A; color: #F7F8FA; padding: 80px; }
  .v9 .top { padding-bottom: 34px; border-bottom: 1px solid rgba(224,168,46,.5); }
  .v9 .brand { display: flex; align-items: center; gap: 16px; }
  .v9 .mark { width: 40px; height: 40px; border-radius: 50%; background: #E0A82E; }
  .v9 .name { font-size: 38px; font-weight: 700; letter-spacing: .02em; }
  .v9 .date { font-size: 28px; font-weight: 500; color: #93A3BC; }
  .v9 .body { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .v9 .cat { align-self: flex-start; font-size: 30px; font-weight: 700; color: #E0A82E; letter-spacing: .16em; margin-bottom: 36px; }
  .v9 .head { font-size: 82px; font-weight: 780; line-height: 1.24; letter-spacing: -.01em; }
  .v9 .sub { margin-top: 42px; font-size: 40px; font-weight: 400; line-height: 1.5; color: #B9C4D4; }
  .v9 .bot { padding-top: 30px; border-top: 1px solid rgba(224,168,46,.5); }
  .v9 .src { font-size: 28px; color: #93A3BC; }
  .v9 .dots span { background: #24395C; }
  .v9 .dots span.on { background: #E0A82E; }

  /* ============ V10 볼드 타이포 ============ */
  .v10 { background: #FFE500; color: #111318; padding: 72px; }
  .v10 .top { padding-bottom: 30px; }
  .v10 .brand { display: flex; align-items: center; gap: 16px; }
  .v10 .mark { width: 40px; height: 40px; background: #111318; }
  .v10 .name { font-size: 38px; font-weight: 900; }
  .v10 .date { font-size: 28px; font-weight: 700; }
  .v10 .body { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .v10 .cat { align-self: flex-start; background: #111318; color: #FFE500; font-size: 32px; font-weight: 900; padding: 10px 26px; margin-bottom: 40px; }
  .v10 .head { font-size: 100px; font-weight: 900; line-height: 1.08; letter-spacing: -.03em; }
  .v10 .src { font-size: 28px; font-weight: 700; }
</style>
</head>
<body>
<script>
  const D = {
    brand: '뉴스한입',
    date: '2026.07.25 (토)',
    category: '경제',
    headline: '미 연준, 3년 만에 기준금리 전격 인하',
    sub: '0.25%p 내린 연 4.00%… 한국 경제엔 어떤 영향?',
    stat: { value: '4.00%', label: '인하 후 미국 기준금리 (기존 4.25%)' },
    source: '출처: Reuters · BBC World',
  };
  const dots = (on) => `<div class="dots">${[0,1,2,3].map(i=>`<span class="${i===on?'on':''}"></span>`).join('')}</div>`;
  const brand = `<div class="brand"><div class="mark"></div><div class="name">${D.brand}</div></div>`;

  const V = {
    1: () => `
      <div class="top row">${brand}<div class="date">${D.date}</div></div>
      <div class="body"><div class="cat">${D.category}</div>
        <div class="head keep">${D.headline}</div><div class="sub keep">${D.sub}</div></div>
      <div class="bot row"><div class="src">${D.source}</div>${dots(0)}</div>`,
    2: () => `
      <div class="top row">${brand}<div class="date">${D.date}</div></div>
      <div class="body"><div class="cat">${D.category}</div>
        <div class="head keep">${D.headline}</div><div class="sub keep">${D.sub}</div></div>
      <div class="bot row"><div class="src">${D.source}</div>${dots(0)}</div>`,
    3: () => `
      <div class="top row">${brand}<div class="date">${D.date}</div></div>
      <div class="body"><div class="cat"><i></i>${D.category}</div>
        <div class="head keep">${D.headline}</div><div class="sub keep">${D.sub}</div></div>
      <div class="bot row"><div class="src">${D.source}</div>${dots(0)}</div>`,
    4: () => `
      <div class="block">
        <div class="row">${brand}<div></div></div>
        <div><div class="cat">${D.category}</div><div class="date">${D.date}</div></div>
      </div>
      <div class="body"><div class="head keep">${D.headline}</div><div class="sub keep">${D.sub}</div></div>
      <div class="src">${D.source}</div>`,
    5: () => `
      <div class="top">${brand}</div>
      <div class="body"><div class="cat">${D.category.toUpperCase()}</div>
        <div class="head keep">${D.headline}</div><div class="sub keep">${D.sub}</div></div>
      <div class="src">${D.source}</div>`,
    6: () => `
      <div class="top row">${brand}<div class="date">${D.date}</div></div>
      <div class="body"><div class="cat">${D.category}</div>
        <div class="head keep">미 연준, 3년 만에 <span class="hl">기준금리</span> 전격 <span class="hl">인하</span></div>
        <div class="sub keep">${D.sub}</div></div>
      <div class="row"><div class="src">${D.source}</div></div>`,
    7: () => `
      <div class="top row">${brand}<div class="date">${D.date}</div></div>
      <div class="body"><div class="cat">${D.category}</div>
        <div class="head keep">${D.headline}</div><div class="sub keep">${D.sub}</div></div>
      <div class="bot row"><div class="src">${D.source}</div>${dots(0)}</div>`,
    8: () => `
      <div class="top row">${brand}<div class="date">${D.date}</div></div>
      <div class="body"><div class="cat">${D.category.toUpperCase()}</div>
        <div class="head keep">${D.headline}</div>
        <div class="big">${D.stat.value}</div><div class="lab">${D.stat.label}</div></div>
      <div class="row"><div class="src">${D.source}</div></div>`,
    9: () => `
      <div class="top row">${brand}<div class="date">${D.date}</div></div>
      <div class="body"><div class="cat">${D.category.toUpperCase()}</div>
        <div class="head keep">${D.headline}</div><div class="sub keep">${D.sub}</div></div>
      <div class="bot row"><div class="src">${D.source}</div>${dots(0)}</div>`,
    10: () => `
      <div class="top row">${brand}<div class="date">${D.date}</div></div>
      <div class="body"><div class="cat">${D.category}</div>
        <div class="head keep">${D.headline}</div></div>
      <div class="row"><div class="src">${D.source}</div></div>`,
  };

  const n = window.__DESIGN__.variant;
  const el = document.createElement('div');
  el.className = 'card v' + n;
  el.innerHTML = V[n]();
  document.body.appendChild(el);
</script>
</body>
</html>
