<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Pretendard';
    src: url('./fonts/PretendardVariable.woff2') format('woff2-variations');
    font-weight: 45 920;
    font-display: block;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 1080px; height: 1350px; overflow: hidden; }

  body {
    font-family: 'Pretendard', sans-serif;
    background: var(--bg);
    color: var(--fg);
    display: flex;
    flex-direction: column;
    padding: 72px;
  }

  /* ---------- themes ---------- */
  .theme-light {
    --bg: #FFFFFF;
    --bg-soft: #F2F3F5;
    --fg: #111318;
    --fg-muted: #6B7280;
    --point: #2456E5;
    --point-fg: #FFFFFF;
    --rule: #E5E7EB;
  }
  .theme-dark {
    --bg: #101418;
    --bg-soft: #1C2228;
    --fg: #F5F6F8;
    --fg-muted: #9AA3AD;
    --point: #4C8DFF;
    --point-fg: #FFFFFF;
    --rule: #2A323B;
  }
  .theme-navy {
    --bg: #0B1F3A;
    --bg-soft: #14294A;
    --fg: #F7F8FA;
    --fg-muted: #93A3BC;
    --point: #E5484D;
    --point-fg: #FFFFFF;
    --rule: #24395C;
  }

  /* ---------- fixed chrome ---------- */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 36px;
    border-bottom: 6px solid var(--fg);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .brand-mark {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: var(--point);
  }
  .brand-name {
    font-size: 40px;
    font-weight: 750;
    letter-spacing: -0.01em;
  }
  .top-date {
    font-size: 30px;
    font-weight: 500;
    color: var(--fg-muted);
  }

  .bottom-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 32px;
    border-top: 2px solid var(--rule);
  }
  .source {
    font-size: 28px;
    font-weight: 400;
    color: var(--fg-muted);
  }
  .page-dots { display: flex; gap: 12px; }
  .page-dots span {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--rule);
  }
  .page-dots span.on { background: var(--point); }

  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 0;
  }

  /* ---------- cover ---------- */
  .badge {
    display: inline-block;
    align-self: flex-start;
    background: var(--point);
    color: var(--point-fg);
    font-size: 34px;
    font-weight: 700;
    padding: 12px 32px;
    border-radius: 999px;
    margin-bottom: 48px;
  }
  .cover-headline {
    font-size: 84px;
    font-weight: 820;
    line-height: 1.24;
    letter-spacing: -0.02em;
    word-break: keep-all;
  }
  .cover-sub {
    margin-top: 44px;
    font-size: 40px;
    font-weight: 500;
    line-height: 1.5;
    color: var(--fg-muted);
    word-break: keep-all;
  }

  /* ---------- body ---------- */
  .kicker {
    font-size: 34px;
    font-weight: 750;
    color: var(--point);
    margin-bottom: 28px;
  }
  .body-title {
    font-size: 60px;
    font-weight: 800;
    line-height: 1.3;
    letter-spacing: -0.015em;
    word-break: keep-all;
    margin-bottom: 40px;
  }
  .body-text {
    font-size: 44px;
    font-weight: 500;
    line-height: 1.62;
    word-break: keep-all;
  }
  .stat {
    margin-top: 56px;
    background: var(--bg-soft);
    border-left: 10px solid var(--point);
    border-radius: 0 20px 20px 0;
    padding: 40px 48px;
  }
  .stat-value {
    font-size: 110px;
    font-weight: 850;
    color: var(--point);
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
  .stat-label {
    margin-top: 12px;
    font-size: 34px;
    font-weight: 500;
    color: var(--fg-muted);
  }

  /* ---------- last ---------- */
  .summary-box {
    background: var(--bg-soft);
    border-radius: 24px;
    padding: 56px;
  }
  .summary-text {
    font-size: 52px;
    font-weight: 700;
    line-height: 1.46;
    letter-spacing: -0.015em;
    word-break: keep-all;
  }
  .insight {
    margin-top: 48px;
    font-size: 40px;
    font-weight: 500;
    line-height: 1.6;
    color: var(--fg-muted);
    word-break: keep-all;
  }
  .cta-row {
    display: flex;
    gap: 24px;
    margin-top: 64px;
  }
  .cta {
    flex: 1;
    text-align: center;
    font-size: 36px;
    font-weight: 700;
    padding: 30px 0;
    border-radius: 18px;
    border: 3px solid var(--point);
    color: var(--point);
  }
  .cta.fill {
    background: var(--point);
    color: var(--point-fg);
  }
</style>
</head>
<body>
<script>
  const { theme, type, data, page, totalPages } = window.__CARD__;
  document.body.classList.add(`theme-${theme}`);

  const dots = Array.from({ length: totalPages }, (_, i) =>
    `<span class="${i + 1 === page ? 'on' : ''}"></span>`).join('');

  const chromeTop = `
    <div class="top-bar">
      <div class="brand"><div class="brand-mark"></div><div class="brand-name">${data.account}</div></div>
      <div class="top-date">${data.date}</div>
    </div>`;
  const chromeBottom = `
    <div class="bottom-bar">
      <div class="source">${data.source}</div>
      <div class="page-dots">${dots}</div>
    </div>`;

  const bodies = {
    cover: c => `
      <div class="content">
        <div class="badge">${c.category}</div>
        <div class="cover-headline">${c.headline}</div>
        <div class="cover-sub">${c.sub}</div>
      </div>`,
    body: c => `
      <div class="content">
        <div class="kicker">${c.kicker}</div>
        <div class="body-title">${c.title}</div>
        <div class="body-text">${c.text}</div>
        ${c.stat ? `<div class="stat"><div class="stat-value">${c.stat.value}</div><div class="stat-label">${c.stat.label}</div></div>` : ''}
      </div>`,
    last: c => `
      <div class="content">
        <div class="kicker">핵심 요약</div>
        <div class="summary-box"><div class="summary-text">${c.summary}</div></div>
        <div class="insight">${c.insight}</div>
        <div class="cta-row">
          <div class="cta">🔖 저장해두고 다시 보기</div>
          <div class="cta fill">✈️ 친구에게 공유하기</div>
        </div>
      </div>`,
  };

  document.body.innerHTML = chromeTop + bodies[type](data.card) + chromeBottom;
</script>
</body>
</html>
