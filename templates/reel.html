<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Pretendard';
    src: url('./fonts/PretendardVariable.woff2') format('woff2-variations');
    font-weight: 45 920;
    font-display: block;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 1080px; height: 1920px; overflow: hidden; }

  /* Reels safe area: top 220px / bottom 420px may be covered by IG UI.
     All content lives inside .safe; chrome hugs the safe boundaries. */
  body {
    font-family: 'Pretendard', sans-serif;
    background: var(--bg);
    color: var(--fg);
  }
  .safe {
    position: absolute;
    top: 220px;
    bottom: 420px;
    left: 72px;
    right: 72px;
    display: flex;
    flex-direction: column;
  }

  .theme-light {
    --bg: #FFFFFF; --bg-soft: #F2F3F5; --fg: #111318; --fg-muted: #6B7280;
    --point: #2456E5; --point-fg: #FFFFFF; --rule: #E5E7EB;
  }
  .theme-dark {
    --bg: #101418; --bg-soft: #1C2228; --fg: #F5F6F8; --fg-muted: #9AA3AD;
    --point: #4C8DFF; --point-fg: #FFFFFF; --rule: #2A323B;
  }
  .theme-navy {
    --bg: #0B1F3A; --bg-soft: #14294A; --fg: #F7F8FA; --fg-muted: #93A3BC;
    --point: #E5484D; --point-fg: #FFFFFF; --rule: #24395C;
  }
  .theme-grad-blue {
    --bg: linear-gradient(150deg, #1E3A8A 0%, #2456E5 55%, #6D28D9 100%);
    --bg-soft: rgba(255,255,255,.12); --fg: #FFFFFF; --fg-muted: rgba(255,255,255,.82);
    --point: #FFFFFF; --point-fg: #1E3A8A; --rule: rgba(255,255,255,.28); --scrim-rgb: 14,22,64;
  }
  .theme-grad-green {
    --bg: linear-gradient(155deg, #061F1C 0%, #0B4A45 50%, #147E6E 100%);
    --bg-soft: rgba(255,255,255,.12); --fg: #FFFFFF; --fg-muted: rgba(255,255,255,.80);
    --point: #FFFFFF; --point-fg: #0B4A45; --rule: rgba(255,255,255,.26); --scrim-rgb: 5,28,26;
  }
  .theme-grad-blue .badge, .theme-grad-green .badge {
    background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.34); color: #FFFFFF;
  }
  .theme-grad-blue .top-bar, .theme-grad-green .top-bar { border-bottom-width: 3px; }
  .theme-bold {
    --bg: #FFE500; --bg-soft: #FFF3A8; --fg: #111318; --fg-muted: #5A551F;
    --point: #111318; --point-fg: #FFE500; --rule: #D4BE00; --scrim-rgb: 26,20,4;
  }
  .theme-bold .badge { border-radius: 6px; font-weight: 900; }
  .theme-bold .cover-headline { font-size: 108px; font-weight: 900; letter-spacing: -.03em; }

  /* 표지 배경 사진 (has-photo) */
  .photo-bg { position: absolute; inset: 0; z-index: 0; background-size: cover; background-position: center; }
  .scrim { position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(180deg,
      rgba(var(--scrim-rgb, 8,12,20), .30) 0%,
      rgba(var(--scrim-rgb, 8,12,20), .50) 42%,
      rgba(var(--scrim-rgb, 8,12,20), .78) 100%); }
  body.has-photo { --fg: #FFFFFF; --fg-muted: rgba(255,255,255,.86); --rule: rgba(255,255,255,.32); }
  body.has-photo .safe { z-index: 2; }
  body.has-photo .top-bar { border-bottom-color: rgba(255,255,255,.42); }
  body.has-photo .brand-mark { background: #FFFFFF; }
  body.has-photo .badge { background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.42); color: #FFFFFF; }
  body.theme-bold.has-photo .badge { background: #111318; border: none; color: #FFE500; }
  body.has-photo .page-dots span { background: rgba(255,255,255,.42); }
  body.has-photo .page-dots span.on { background: #FFFFFF; }
  body.has-photo .cover-headline { text-shadow: 0 2px 30px rgba(0,0,0,.5); }

  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 40px;
    border-bottom: 6px solid var(--fg);
  }
  .brand { display: flex; align-items: center; gap: 20px; }
  .brand-mark { width: 52px; height: 52px; border-radius: 14px; background: var(--point); }
  .brand-name { font-size: 46px; font-weight: 750; letter-spacing: -0.01em; }
  .top-date { font-size: 34px; font-weight: 500; color: var(--fg-muted); }

  .bottom-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 36px;
    border-top: 2px solid var(--rule);
  }
  .source { font-size: 30px; color: var(--fg-muted); }
  .page-dots { display: flex; gap: 14px; }
  .page-dots span { width: 18px; height: 18px; border-radius: 50%; background: var(--rule); }
  .page-dots span.on { background: var(--point); }

  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 0;
  }

  .badge {
    display: inline-block;
    align-self: flex-start;
    background: var(--point);
    color: var(--point-fg);
    font-size: 38px;
    font-weight: 700;
    padding: 14px 36px;
    border-radius: 999px;
    margin-bottom: 56px;
  }
  .cover-headline {
    font-size: 96px;
    font-weight: 820;
    line-height: 1.24;
    letter-spacing: -0.02em;
    word-break: keep-all;
  }
  .cover-sub {
    margin-top: 52px;
    font-size: 46px;
    font-weight: 500;
    line-height: 1.5;
    color: var(--fg-muted);
    word-break: keep-all;
  }

  .kicker { font-size: 38px; font-weight: 750; color: var(--point); margin-bottom: 32px; }
  .body-title {
    font-size: 68px; font-weight: 800; line-height: 1.3;
    letter-spacing: -0.015em; word-break: keep-all; margin-bottom: 44px;
  }
  .body-text { font-size: 50px; font-weight: 500; line-height: 1.62; word-break: keep-all; }
  .stat {
    margin-top: 64px; background: var(--bg-soft);
    border-left: 12px solid var(--point);
    border-radius: 0 22px 22px 0; padding: 48px 56px;
  }
  .stat-value { font-size: 130px; font-weight: 850; color: var(--point); letter-spacing: -0.02em; line-height: 1.1; }
  .stat-label { margin-top: 14px; font-size: 38px; font-weight: 500; color: var(--fg-muted); }

  .summary-box { background: var(--bg-soft); border-radius: 28px; padding: 64px; }
  .summary-text { font-size: 60px; font-weight: 700; line-height: 1.46; letter-spacing: -0.015em; word-break: keep-all; }
  .insight { margin-top: 56px; font-size: 46px; font-weight: 500; line-height: 1.6; color: var(--fg-muted); word-break: keep-all; }
  .cta-row { display: flex; gap: 28px; margin-top: 72px; }
  .cta {
    flex: 1; text-align: center; font-size: 40px; font-weight: 700;
    padding: 34px 0; border-radius: 20px; border: 3px solid var(--point); color: var(--point);
  }
  .cta.fill { background: var(--point); color: var(--point-fg); }
</style>
</head>
<body>
<script>
  const { theme, type, data, page, totalPages } = window.__CARD__;
  document.body.classList.add(`theme-${theme}`);

  const dots = Array.from({ length: totalPages }, (_, i) =>
    `<span class="${i + 1 === page ? 'on' : ''}"></span>`).join('');

  const chromeTop = `
    <div class="top-bar">
      <div class="brand"><div class="brand-mark"></div><div class="brand-name">${data.account}</div></div>
      <div class="top-date">${data.date}</div>
    </div>`;
  const chromeBottom = `
    <div class="bottom-bar">
      <div class="source">${data.source}</div>
      <div class="page-dots">${dots}</div>
    </div>`;

  const bodies = {
    cover: c => `
      <div class="content">
        <div class="badge">${c.category}</div>
        <div class="cover-headline">${c.headline}</div>
        <div class="cover-sub">${c.sub}</div>
      </div>`,
    body: c => `
      <div class="content">
        <div class="kicker">${c.kicker}</div>
        <div class="body-title">${c.title}</div>
        <div class="body-text">${c.text}</div>
        ${c.stat ? `<div class="stat"><div class="stat-value">${c.stat.value}</div><div class="stat-label">${c.stat.label}</div></div>` : ''}
      </div>`,
    last: c => `
      <div class="content">
        <div class="kicker">핵심 요약</div>
        <div class="summary-box"><div class="summary-text">${c.summary}</div></div>
        <div class="insight">${c.insight}</div>
        <div class="cta-row">
          <div class="cta">🔖 저장해두고 다시 보기</div>
          <div class="cta fill">✈️ 친구에게 공유하기</div>
        </div>
      </div>`,
  };

  document.body.innerHTML = `<div class="safe">${chromeTop}${bodies[type](data.card)}${chromeBottom}</div>`;

  if (type === 'cover' && data.card.bg) {
    document.body.classList.add('has-photo');
    document.body.insertAdjacentHTML(
      'afterbegin',
      `<div class="photo-bg" style="background-image:url('${data.card.bg}')"></div><div class="scrim"></div>`
    );
  }
</script>
</body>
</html>
